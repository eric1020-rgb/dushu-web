<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1419" />
<meta name="description" content="讀書 — 粵語對話式投資書帶讀：書摘、對話、心智圖、音訊" />
<title>讀書 · 投資帶讀圖書館</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="hub.css" />
</head>
<body>
<div class="hub">
  <header class="hub-header">
    <div class="hub-brand">
      <div class="hub-logo">讀</div>
      <div>
        <div class="hub-title">讀書</div>
        <div class="hub-sub">粵語對話式帶讀 · 投資系列</div>
      </div>
    </div>
  </header>

  <main class="hub-main">
    <section class="hub-hero">
      <p class="hub-kicker">個人成長 · 投資素養</p>
      <h1>聽完好似睇過本書</h1>
      <p class="hub-lead">書摘、對話帶讀、心智圖、粵語音訊一齊有。聲線：穩重港男聲（WanLungNeural）。</p>
      <div class="hub-meta-row">
        <span>20 本</span>
        <span>·</span>
        <span>合共約 6 小時</span>
        <span>·</span>
        <span>手機優先</span>
      </div>
    </section>

    <p class="section-label">書庫</p>
    <div class="book-grid" id="book-grid">
      <!-- cards injected -->
    </div>

    <footer class="hub-footer">
      <p>概念導讀／對話式改寫，唔係原書逐字朗讀。</p>
      <p>語音：zh-HK-WanLungNeural · 無開場白，直接入章。</p>
    </footer>
  </main>
</div>
<script src="hub.js"></script>
</body>
</html>
