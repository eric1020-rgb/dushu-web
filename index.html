<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F4F9FF" />
<meta name="description" content="讀書 — 粵語對話式投資書帶讀：書摘、對話、心智圖、音訊" />
<title>讀書 · 投資帶讀圖書館</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="hub.css?v=leap-1" />
</head>
<body>
<div class="hub">
  <header class="topbar">
    <a class="brand" href="#for-you" aria-label="讀書首頁">
      <div class="brand-mark" aria-hidden="true">讀</div>
      <div class="brand-text">
        <div class="brand-name">讀書</div>
        <div class="brand-tag">粵語對話式帶讀</div>
      </div>
    </a>
    <nav class="top-links" aria-label="主要">
      <a href="#explore">探索</a>
      <a href="#library">書庫</a>
    </nav>
  </header>

  <section class="hero" id="for-you">
    <p class="hero-kicker">個人成長 · 投資素養</p>
    <h1>投資帶讀圖書館</h1>
    <p class="hero-lead">聽完好似睇過本書。書摘、對話帶讀、心智圖、粵語音訊一齊有。已換 MiniMax ProfessionalHost 男聲嘅書會以白底同金色標籤標示。</p>
    <div class="hero-meta" id="hero-meta">
      <span>載入中…</span>
    </div>
  </section>

  <main class="hub-body">
    <div class="search-row" id="explore">
      <label class="search-field" for="hub-search">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="hub-search" type="search" placeholder="書名、作者或主題" autocomplete="off" enterkeyhint="search" />
      </label>
    </div>

    <div class="chips-row" role="toolbar" aria-label="主題篩選">
      <div class="chips" id="track-chips"></div>
    </div>

    <div id="rails" class="rails"></div>

    <section class="library-section" id="library">
      <div class="section-head">
        <h2>全部書目</h2>
        <p class="section-meta"><span id="book-count">0</span> 本</p>
      </div>
      <div class="book-grid" id="book-grid"></div>
    </section>

    <section class="about-section" id="about">
      <h2>關於「讀書」</h2>
      <p>概念導讀／對話式改寫，唔係原書逐字朗讀。語音預設 zh-HK-WanLungNeural；白底書卡同「MiniMax 新聲」標籤 = MiniMax Cantonese_ProfessionalHost（M）· 無開場白，直接入章。</p>
    </section>

    <footer class="hub-footer">
      <p>讀書 · 投資帶讀圖書館</p>
    </footer>
  </main>

  <nav class="bottom-tabs" aria-label="底部導覽">
    <a class="bottom-tab is-active" href="#for-you">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z"/></svg>
      <span>為你推薦</span>
    </a>
    <a class="bottom-tab" href="#explore">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M14.5 9.5l-2 5-5 2 2-5 5-2z"/></svg>
      <span>探索</span>
    </a>
    <a class="bottom-tab" href="#library">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>書庫</span>
    </a>
    <a class="bottom-tab" href="#about">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 10v6M12 7h.01"/></svg>
      <span>關於</span>
    </a>
  </nav>
</div>
<script src="hub.js?v=leap-1"></script>
</body>
</html>
